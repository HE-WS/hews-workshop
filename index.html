<style>
/* VOICE: plain, sturdy workshop tool — big targets for gloved hands at the machine.
   IDEA: the job-ticket board on a fabrication shop wall, under a hazard-striped header.
   PICTURE: the live machine board itself; remnants drawn to scale as steel plates with dimensions.
   COLOUR and TYPE: steel grey ground, near-black ink, hi-vis yellow for actions; Barlow Condensed signage + Barlow.
   LAYOUT: header with tabs, then one working view; three machine columns that stack on phones. */
:root{color-scheme:light dark;--bg:light-dark(#e6e9eb,#101315);--card:light-dark(#fff,#1a1e21);--ink:light-dark(#14181c,#eef1f3);--mut:light-dark(#57616a,#9aa4ad);--line:light-dark(#cbd1d6,#2d3439);--hi:#f7d600;--run:light-dark(#0b7a3b,#46d184);--bad:light-dark(#c4271b,#ff7a6e);--steel:light-dark(#bcc4cb,#55606a);--soft:light-dark(#f3f5f6,#14181b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",system-ui,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed","Segoe UI",Arial,sans-serif;line-height:1.05;margin:0;text-wrap:balance;font-weight:700}
header{background:#14181c;color:#eef1f3;padding:16px max(4vw,16px) 0}
.top{display:flex;align-items:center;gap:14px 28px;max-width:1240px;margin:auto;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px}.mark{height:68px;width:auto;display:block}.wm b{display:block;font:700 23px/1.05 "Barlow Condensed","Arial Narrow","Roboto Condensed","Segoe UI",Arial,sans-serif;color:#fff;letter-spacing:.01em}.wm b i{font-style:normal;color:var(--hi)}.wm span{display:block;margin-top:4px;font-size:13px;color:#a9b3bb}.app{border-left:1px solid #39424a;padding-left:28px}.app h1{font-size:clamp(24px,3.2vw,34px)}.top .sub{display:block;margin-top:2px}@media(max-width:900px){.app{border-left:0;padding-left:0;flex-basis:100%}.app h1{font-size:22px}.mark{height:50px}.wm b{font-size:19px}}
h1{font-size:clamp(30px,5vw,44px)}.sub{color:#a9b3bb;font-size:15px}
nav{display:flex;gap:4px;max-width:1240px;margin:12px auto 0;overflow-x:auto}
nav a{flex:none;color:#eef1f3;text-decoration:none;padding:12px 16px;font-weight:600;border-radius:8px 8px 0 0;min-height:44px}
nav a.on{background:var(--hi);color:#14181c}
.haz{height:10px;background:repeating-linear-gradient(-45deg,var(--hi) 0 14px,#14181c 14px 28px)}
main{max-width:1240px;margin:auto;padding:clamp(18px,3vw,36px) max(4vw,16px) 60px}
h2{font-size:32px;margin-bottom:6px}h3{font-size:22px}
.mut{color:var(--mut)}.small{font-size:14px}
.note{background:var(--hi);color:#14181c;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-weight:500}
.warn{color:var(--bad);font-weight:600;font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px}
.colh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 4px 10px;border-bottom:3px solid var(--ink);margin-bottom:10px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;position:relative}
.ticket.run{border:2px solid var(--run)}
.tno{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed","Segoe UI",Arial,sans-serif;font-weight:700;font-size:22px}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--line);white-space:nowrap}
.chip.run{background:var(--run);color:var(--card)}.chip.bad{background:var(--bad);color:#fff}.chip.ok{background:transparent;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
button,.btn{font:600 16px Barlow,sans-serif;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.go{background:var(--hi);color:#14181c;border-color:#c9a200}
button.big{font-size:22px;min-height:64px;padding:12px 28px;width:100%}
button.sm{min-height:44px;min-width:44px;padding:6px 10px}
button.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:4px}
input,select{font:16px Barlow,sans-serif;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;align-items:end}
.mpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:18px}
.mpick button{min-height:64px;font-size:19px}.mpick button.on{background:var(--ink);color:var(--bg)}
.now{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.bigno{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed","Segoe UI",Arial,sans-serif;font-size:52px;font-weight:700;line-height:1}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0}dt{color:var(--mut)}dd{margin:0;font-weight:600}
.piece{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
.shp{width:100%;height:auto;display:block}.plate{fill:var(--steel);stroke:var(--ink);stroke-width:1.5}.dim{stroke:var(--mut);stroke-width:1}.dl{fill:var(--ink);font:600 12px Barlow,sans-serif}.cut{fill:none;stroke:var(--mut);stroke-dasharray:4 3}
.shp .plate{fill-rule:evenodd}.shp .el{fill:var(--ink);font:600 11px Barlow,sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:3px}
.shpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:4px 0 8px}
.shpick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;min-height:84px;font-size:12px;font-weight:600;line-height:1.15;background:var(--card);color:var(--ink)}
.shpick button svg{width:56px;height:38px}.shpick button svg *{fill:var(--steel);stroke:var(--ink);stroke-width:1.5;fill-rule:evenodd}
.shpick button.on{outline:3px solid var(--hi);outline-offset:-3px;background:var(--card);color:var(--ink)}

<script>
{
const MACH=[{id:'plasma',name:'Plasma',sw:'FastNest 7'},{id:'laser',name:'Laser',sw:'CypNest 2026'},{id:'bend',name:'Bending',sw:''},{id:'roll',name:'Rolling',sw:'Bending dept.'}];
const isForm=m=>m==='bend'||m==='roll';
const RSHAPES=['Cylinder','Cone','Arc / segment','Pipe sleeve'];   // bending department: no plate stock
const DEF_TYPES=[{name:'Mild steel',dens:7.85},{name:'Hardox',dens:7.85},{name:'Strenx',dens:7.85},{name:'CCO',dens:7.7}];
/* ---------- Leftover shapes: every shape is an outline (mm) with optional holes ---------- */
const arcPts=(cx,cy,r,a0,a1,n)=>Array.from({length:n+1},(_,i)=>{const t=a0+(a1-a0)*i/n;return[cx+r*Math.cos(t),cy+r*Math.sin(t)]});
const circPts=(cx,cy,r)=>arcPts(cx,cy,r,0,2*Math.PI,180).slice(0,-1);
const SHAPES={
  rect:{n:'Rectangle',f:['L','W'],g:d=>({o:[[0,0],[d.L,0],[d.L,d.W],[0,d.W]]})},
  L:{n:'L-shape (corner cut out)',f:['L','W','a','b'],lab:{a:'Cut-out length mm',b:'Cut-out width mm'},ok:d=>d.a<d.L&&d.b<d.W,
    g:d=>({o:[[0,0],[d.L-d.a,0],[d.L-d.a,d.b],[d.L,d.b],[d.L,d.W],[0,d.W]]})},
  chamf:{n:'Corner cut at an angle',f:['L','W','a','b'],lab:{a:'Cut along length mm',b:'Cut along width mm'},ok:d=>d.a<=d.L&&d.b<=d.W,
    g:d=>({o:[[0,0],[d.L-d.a,0],[d.L,d.b],[d.L,d.W],[0,d.W]]})},
  U:{n:'U-shape (notch in one side)',f:['L','W','a','b'],lab:{a:'Notch length mm',b:'Notch depth mm'},ok:d=>d.a<d.L&&d.b<d.W,
    g:d=>{const x=(d.L-d.a)/2;return{o:[[0,0],[x,0],[x,d.b],[x+d.a,d.b],[x+d.a,0],[d.L,0],[d.L,d.W],[0,d.W]]}}},
  tri:{n:'Triangle (right angle)',f:['L','W'],g:d=>({o:[[0,0],[d.L,d.W],[0,d.W]]})},
  tri2:{n:'Triangle (any)',f:['L','W','c'],lab:{L:'Base mm',W:'Height mm',c:'Top point from left mm'},opt:['c'],ok:d=>d.c<=d.L,
    g:d=>({o:[[d.c,0],[d.L,d.W],[0,d.W]]})},
  trap:{n:'Trapezoid (both sides sloped)',f:['L','W','T'],lab:{L:'Long side mm',W:'Height mm',T:'Short side mm'},ok:d=>d.T<d.L,
    g:d=>{const x=(d.L-d.T)/2;return{o:[[x,0],[x+d.T,0],[d.L,d.W],[0,d.W]]}}},
  rtrap:{n:'Trapezoid (one square side)',f:['L','W','T'],lab:{L:'Long side mm',W:'Height mm',T:'Short side mm'},ok:d=>d.T<d.L,
    g:d=>({o:[[0,0],[d.T,0],[d.L,d.W],[0,d.W]]})},
  circle:{n:'Circle (disc)',f:['D'],g:d=>({o:circPts(d.D/2,d.D/2,d.D/2)})},
  semi:{n:'Half circle',f:['D'],g:d=>({o:arcPts(d.D/2,d.D/2,d.D/2,Math.PI,2*Math.PI,90)})},
  ring:{n:'Ring (disc with hole)',f:['D','h'],ok:d=>d.h<d.D,g:d=>({o:circPts(d.D/2,d.D/2,d.D/2),h:[circPts(d.D/2,d.D/2,d.h/2)]})},
  rhole:{n:'Rectangle with round hole',f:['L','W','h'],ok:d=>d.h<Math.min(d.L,d.W),g:d=>({o:[[0,0],[d.L,0],[d.L,d.W],[0,d.W]],h:[circPts(d.L/2,d.W/2,d.h/2)]})},
  poly:{n:'✏ Draw my own shape',f:[],g:d=>({o:(d.pts||[]).map(p=>[num(p[0]),num(p[1])])})}
};
const DLAB={L:'Length mm',W:'Width mm',a:'Cut-out length mm',b:'Cut-out width mm',c:'Offset mm',T:'Short side mm',D:'Diameter mm',h:'Hole diameter mm'};
const fLab=(sh,k)=>((SHAPES[sh]||{}).lab||{})[k]||DLAB[k]||k;
const shapeOf=p=>SHAPES[p&&p.shape]?p.shape:'rect';
function geom(shape,d){d=d||{};const S0=SHAPES[shape]||SHAPES.rect,dd={};for(const k of ['L','W','a','b','c','T','D','h'])dd[k]=num(d[k]);dd.pts=d.pts;
  try{return S0.g(dd)}catch(e){return{o:[]}}}
const shoe=pts=>{let a=0;for(let i=0;i<pts.length;i++){const[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];a+=x1*y2-x2*y1}return Math.abs(a)/2};
function bbox(pts){if(!pts.length)return{x:0,y:0,L:0,W:0};const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys);return{x,y,L:Math.max(...xs)-x,W:Math.max(...ys)-y}}
function segCross(a,b,c,d){const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]));return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0}
function polyCrosses(pts){const n=pts.length;for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;if(segCross(pts[i],pts[(i+1)%n],pts[j],pts[(j+1)%n]))return true}return false}
/* is a leftover piece complete? returns '' or what is missing */
function shapeProblem(p){const sh=shapeOf(p),S0=SHAPES[sh],d=p.d||{};
  if(sh==='poly'){const pts=d.pts||[];if(pts.length<3)return 'a drawn piece needs at least 3 corners';if(polyCrosses(pts))return 'the lines of a drawn piece cross each other';if(shoe(pts)<=0)return 'a drawn piece has no area';return ''}
  for(const k of S0.f)if(!(num(d[k])>0)&&!(S0.opt||[]).includes(k))return `${S0.n.toLowerCase()}: ${fLab(sh,k).replace(/ mm$/,'').toLowerCase()} is missing`;
  const dd={};for(const k of S0.f)dd[k]=num(d[k]);if(S0.ok&&!S0.ok(dd))return `${S0.n.toLowerCase()}: the cut-out / hole must be smaller than the piece`;return ''}
/* store the outside size (L × W) with every piece so lists and sorting keep working */
function withBox(shape,d){const g=geom(shape,d),b=bbox(g.o||[]),o={...d};
  if(shape==='poly'){o.pts=(d.pts||[]).map(p=>[Math.round(num(p[0])-b.x),Math.round(num(p[1])-b.y)])}
  o.L=Math.round(b.L);o.W=Math.round(b.W);return o}
const ST={available:'In stock',ordered:'On order',used:'Used',scrap:'Scrap'};
let S={types:[],materials:[],plates:[],jobs:[],events:[],maint:{},acc:[],accLog:[],ordLog:[],auth:{users:[],op:{}}},ref=null,assets=null,dls=null,evSeen=null,myEv=new Set(),toastT=0,ac=null,zoom='',busy=0,q=Promise.resolve(),ready=false,msg='',armed='';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let opM=ls.get('opM')||'plasma';
const draft={job:{machine:'plasma',part:'',program:'',materialId:'',plates:[],photos:[],qty:1,nlines:1,lines:[{no:'',m2:''}]},end:{jobId:''},pf:{mat:'',st:'available',or:''},sf:'',open:'',rc:{L:'',W:'',n:1,st:'available'},nt:{name:'',dens:7.85},na:{machine:'plasma',name:'',part:'',qty:'',min:'2',supplier:''},am:'',ord:{mk:'',mid:'',nt:'',L:'',W:'',n:1,sup:'',po:''},of:'',mat:{type:'Hardox',grade:'',thick:'',code:'',reorder:0,supplier:''}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const f2=n=>num(n).toFixed(2);
const types=()=>S.types&&S.types.length?S.types:DEF_TYPES;
const dens=t=>num((types().find(x=>x.name===t)||{}).dens)||7.85;
const mat=id=>S.materials.find(m=>m.id===id);
const mName=m=>m?`${m.type}${m.grade?' '+m.grade:''} ${m.thick} mm`:'No stock material';
const bySeq=(a,b)=>num(a.seq)-num(b.seq);
const byThick=(a,b)=>num(a.thick)-num(b.thick)||String(a.grade).localeCompare(String(b.grade));
const area=p=>{const sh=shapeOf(p),d=p.d||{};if(sh==='rect')return Math.max(num(d.L)*num(d.W),0)/1e6;
  if(sh==='circle')return Math.PI*Math.pow(num(d.D)/2,2)/1e6;if(sh==='semi')return Math.PI*Math.pow(num(d.D)/2,2)/2e6;
  if(sh==='ring')return Math.max(Math.PI*(Math.pow(num(d.D)/2,2)-Math.pow(num(d.h)/2,2)),0)/1e6;
  if(sh==='rhole')return Math.max(num(d.L)*num(d.W)-Math.PI*Math.pow(num(d.h)/2,2),0)/1e6;
  const g=geom(sh,d);return Math.max(shoe(g.o||[])-(g.h||[]).reduce((x,h)=>x+shoe(h),0),0)/1e6};
const kg=p=>{const m=mat(p.materialId);return m?area(p)*num(m.thick)*dens(m.type):0};
const pDesc=p=>{const d=p.d||{},sh=shapeOf(p);switch(sh){
  case 'L':return `${d.L}×${d.W} less ${d.a}×${d.b}`;case 'tri':return `${d.L}×${d.W} triangle`;case 'tri2':return `${d.L}×${d.W} triangle`;
  case 'chamf':return `${d.L}×${d.W} corner cut ${d.a}×${d.b}`;case 'U':return `${d.L}×${d.W} notch ${d.a}×${d.b}`;
  case 'trap':case 'rtrap':return `${d.L}/${d.T}×${d.W} trapezoid`;case 'circle':return `Ø${d.D} disc`;case 'semi':return `Ø${d.D} half circle`;
  case 'ring':return `Ø${d.D} ring, hole Ø${d.h}`;case 'rhole':return `${d.L}×${d.W} hole Ø${d.h}`;
  case 'poly':return `${d.L}×${d.W} drawn (${(d.pts||[]).length} corners)`;default:return `${d.L}×${d.W}`}};
const plate=id=>S.plates.find(p=>p.id===id);
const rset=()=>new Set(S.jobs.filter(j=>j.status!=='done').flatMap(j=>j.plates||[]));
const platesOf=(mid,st)=>S.plates.filter(p=>p.materialId===mid&&(!st||p.status===st));
const sumA=arr=>arr.reduce((x,p)=>x+area(p),0);
function stats(m,rs=rset()){const av=platesOf(m.id,'available'),on=sumA(av),res=sumA(av.filter(p=>rs.has(p.id)));return {n:av.length,on,res,free:on-res,ord:sumA(platesOf(m.id,'ordered'))}}
const low=(m,s)=>num(m.reorder)>0&&s.free<=num(m.reorder);
const nextId=(p,arr,base)=>p+(arr.reduce((x,o)=>Math.max(x,parseInt(String(o.id).replace(/\D/g,''))||0),base)+1);
const tm=t=>t?new Date(t).toLocaleString([],{dateStyle:'short',timeStyle:'short'}):'';
const matOpts=(sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+[...new Set(S.materials.map(m=>m.type))].map(t=>`<optgroup label="${esc(t)}">`+S.materials.filter(m=>m.type===t).sort(byThick).map(m=>`<option value="${esc(m.id)}"${m.id===sel?' selected':''}>${esc(mName(m))}</option>`).join('')+'</optgroup>').join('');
const note=()=>msg?`<div class="note">${esc(msg)}</div>`:'';
const lastOnes=()=>S.materials.filter(m=>platesOf(m.id,'available').length===1).sort((a,b)=>String(a.type).localeCompare(b.type)||byThick(a,b));
const REASONS=['Machine breakdown','Material missing / wrong','Drawing or program problem','Quality problem','Need help','Other'];
const openProbs=()=>(S.events||[]).filter(e=>e.type==='problem'&&!e.resolved);
const GAS={plasma:[['air','Air','Compressed air','#2a8fd6'],['oxyfuel','Oxy-fuel','Oxygen + fuel gas','#e0601e']],laser:[['air','Air','Compressed air','#2a8fd6'],['o2','Oxygen','O₂','#e0601e'],['n2','Nitrogen','N₂','#6b4fd8']]};
const gasInfo=(m,g)=>(GAS[m]||[]).find(x=>x[0]===g);
const gasName=(m,g)=>{const x=gasInfo(m,g);return x?x[1]+(x[0]==='o2'?' (O₂)':x[0]==='n2'?' (N₂)':''):''};
const gasChip=j=>{const x=gasInfo(j.machine,j.gas);return x?`<span class="gchip" style="--gc:${x[3]}"><i></i>${esc(gasName(j.machine,j.gas))}</span>`:''};

const prefs=()=>{let p=null;try{p=JSON.parse(ls.get('alarmPrefs')||'null')}catch(e){}return p||{plasma_start:true,plasma_end:true,laser_start:true,laser_end:true,bend_start:true,bend_end:true,roll_start:true,roll_end:true,sound:true}};
const setPrefs=p=>ls.set('alarmPrefs',JSON.stringify(p));

const seenT=()=>num(ls.get('evSeen'));

/* ---------- Order ---------- */
const mk=m=>m.type+'|'+(m.grade||'');
const msort=()=>S.materials.slice().sort((a,b)=>String(a.type).localeCompare(b.type)||String(a.grade).localeCompare(String(b.grade),undefined,{numeric:true})||byThick(a,b));
function orderLines(){
  const L=new Map();
  for(const p of S.plates.filter(p=>p.status==='ordered')){const m=mat(p.materialId);if(!m)continue;const k=p.line||('count|'+p.materialId+'|'+pDesc(p));
    if(!L.has(k))L.set(k,{key:k,line:p.line||'',m,size:pDesc(p),d:p.d,date:p.orderedAt||p.createdAt,supplier:p.supplier||m.supplier||'',po:p.po||'',plates:[]});L.get(k).plates.push(p)}
  return [...L.values()].sort((a,b)=>String(a.m.type).localeCompare(b.m.type)||byThick(a.m,b.m)||num(a.date)-num(b.date));
}
function vOrder(){
  const od=draft.ord,srt=msort(),keys=[...new Set(srt.map(mk))];

  const tn=[...new Set(srt.map(m=>m.type))],of=tn.includes(draft.of)?draft.of:'',lines=orderLines().filter(l=>!of||l.m.type===of);
  const tA=lines.reduce((x,l)=>x+sumA(l.plates),0),tK=lines.reduce((x,l)=>x+l.plates.reduce((y,p)=>y+kg(p),0),0),tQ=lines.reduce((x,l)=>x+l.plates.length,0);
  let o=`${note()}<h2>Plate orders</h2><p class="mut">Add the plates you're ordering. Each line goes straight into stock as <b>on order</b>; press Arrived when it's delivered.</p>
  <div class="panel" style="margin-bottom:22px"><h3 style="margin-bottom:12px">Add to order</h3><div class="form">

let srvBusy=false;
async function srvAct(a,id,val){if(srvBusy)return;srvBusy=true;
  const st=draft.st||{},lg=draft.lg||{},nm=x=>((adm&&adm.users||[]).find(u=>u.id===x)||{}).name||'';
  const ok=(d,t)=>{if(d&&d.users)adm=d;setMsg(t);render()};
  try{
    if(a==='logout'){try{await SRV.logout()}catch(e){}location.replace(location.pathname);return}
    if(a==='lgGo'){const r=await SRV.login(lg.mode==='plan'?{kind:'u',name:lg.name,pw:lg.pw}:{kind:lg.kind,pw:lg.pw});msg='';loggedIn(r.me);return}
    if(a==='lgSetup'){const n=String(lg.name||'').trim();
      if(!n){setMsg('Type the administrator name.');render();return}if(String(lg.pw||'').length<4){setMsg('The password needs at least 4 characters.');render();return}if(lg.pw!==lg.pw2){setMsg('The two passwords are not the same.');render();return}
      const r=await SRV.setup({name:n,pw:lg.pw,code:lg.code||''});loggedIn(r.me,'#settings');setMsg('Administrator created. Now add the planners and set the operator passwords.');return}
    if(a==='uAdd'){const d=await SRV.admin('POST','/users',{name:st.name,pw:st.pw,role:st.role});const t=`${String(st.name).trim()} added as ${ROLE[st.role==='admin'?'admin':'user']}.`;draft.st={...st,name:'',pw:'',role:'user'};ok(d,t);return}
    if(a==='uPwSave'){const d=await SRV.admin('PATCH','/users/'+id,{pw:String(st.npw||'')});const t='Password changed for '+nm(id)+'.';st.pwFor='';st.npw='';ok(d,t);return}
    if(a==='uDel'){const t=nm(id)+' removed.';const d=await SRV.admin('DELETE','/users/'+id);ok(d,t);return}
    if(a==='urole'){const d=await SRV.admin('PATCH','/users/'+id,{role:val});ok(d,`${nm(id)} is now ${ROLE[val==='admin'?'admin':'user']}.`);return}
    if(a==='opPw'){const d=await SRV.admin('PUT','/op/'+id,{pw:String((st.op||{})[id]||'')});(st.op||(st.op={}))[id]='';ok(d,`${OPK[id].name} operator password saved.`);return}

    if(a==='lgGo')lg.pw='';if(a==='urole')adm=null;setMsg(e.message||String(e));render();if(a==='lgGo')setTimeout(()=>$('#lgP')?.focus(),0)}
  finally{srvBusy=false}}

document.addEventListener('input',e=>{

  if(d.lr!=null&&d.k){const r=draft.end.lr&&draft.end.lr[+d.lr];if(r)r[d.k]=t.value;return}
  if(d.dj==='nlines'){draft.job.nlines=t.value;if(num(t.value)>=1){fitLines(draft.job);render()}return}
  if(d.dj)draft.job[d.dj]=val;else if(d.de)draft.end[d.de]=val;else if(d.dm)draft.mat[d.dm]=t.type==='number'?t.value:t.value;else if(d.nt)draft.nt[d.nt]=val;else if(d.rc)draft.rc[d.rc]=t.value;
  else if(d.od){draft.ord[d.od]=t.value;const pv=$('#oPrev');if(pv)pv.textContent=ordPrev()}
  else if(d.p!=null&&d.k){const p=draft.end.pieces[+d.p];if(!p)return;p.d[d.k]=num(t.value);const j=S.jobs.find(x=>x.id===draft.end.jobId),pp={...p,materialId:j&&j.materialId};$('#pv'+d.p).innerHTML=shapeSVG(p.shape,p.d);$('#pa'+d.p).textContent=`${f2(area(pp))} m² · ${kg(pp).toFixed(1)} kg`}
  else if(d.pr&&draft.prob)draft.prob[d.pr]=t.value;
  else if(d.hlc){ls.set('hlc',t.value);applyHl();return}
  else if(d.doneq){(draft.doneQ||(draft.doneQ={}))[d.doneq]=t.value;render();return}
  else if(d.lg){(draft.lg||(draft.lg={mode:''}))[d.lg]=t.value;return}
  else if(d.st&&draft.st){draft.st[d.st]=t.value;return}
  else if(d.sto&&draft.st){(draft.st.op||(draft.st.op={}))[d.sto]=t.value;return}
  else if(d.blo){ls.set('blo',t.value);applyBlo();return}
  else if(d.hd==='hq'){draft.hq=t.value;render();return}
  else if(d.na){draft.na[d.na]=t.value;return}
  else if(d.ch&&draft.chg){draft.chg[d.ch]=t.value;if(d.ch==='n')render();return}
  else if(d.jq){draft.jq=t.value;render()}
  else if(t.id==='opName')ls.set('opName',t.value);

  else if(a==='orderFor'){const m=mat(id);if(m){draft.ord={...draft.ord,mk:mk(m),mid:m.id,nt:''};const p=platesOf(m.id,'available')[0];if(p&&p.origin!=='offcut'&&!draft.ord.L){draft.ord.L=p.d.L;draft.ord.W=p.d.W}draft.of='';location.hash='#order'}}
  else if(a==='maint'){const cur=(S.maint||{})[id];S.maint={...(S.maint||{}),[id]:cur&&cur.on?{on:false}:{on:true,since:Date.now()}};setMsg(`${MN(id)} maintenance ${cur&&cur.on?'turned off — jobs are visible to the operator again':'turned on — the operator screen is now red'}.`);save()}
  else if(a==='hs'){draft.hs=id;render()}
  else if(a==='hopen'){draft.hopen=draft.hopen===id?'':id;render()}
  else if(a==='hclr'){draft.hf='';draft.ht='';render()}
  else if(a==='hxls'){exportHist()}
  else if(a==='am'){draft.am=id||'';render()}
  else if(a==='axls'){exportAcc()}
  else if(a==='aadd'){const na=draft.na,n=String(na.name||'').trim();if(!n){setMsg('Type the accessory name.');render();return}
    const it={id:nextId('A-',S.acc||[],0),machine:na.machine,name:n,part:String(na.part||'').trim(),qty:Math.max(0,Math.round(num(na.qty))),min:String(na.min).trim()===''?2:Math.max(0,Math.round(num(na.min))),supplier:String(na.supplier||'').trim()};
    S.acc=[...(S.acc||[]),it];accLogAdd(it,it.qty,'','added with '+it.qty+' in stock');draft.na={...na,name:'',part:'',qty:'',min:'2'};setMsg(`${MN(it.machine)} · ${it.name} added.`);save()}
  else if(a==='arecv'){const it=(S.acc||[]).find(x=>x.id===id),n=Math.round(num($('#ar'+CSS.escape(id))?.value));if(it&&n>0){it.qty=num(it.qty)+n;accLogAdd(it,n,'','received');setMsg(`${n} × ${it.name} received.`);save()}}
  else if(a==='ause'){const it=(S.acc||[]).find(x=>x.id===id);if(it&&num(it.qty)>0){accTake(it,1,'Planner','');save()}}
  else if(a==='adel'){if(armed!=='ad'+id){armed='ad'+id;render();return}S.acc=(S.acc||[]).filter(x=>x.id!==id);armed='';save()}
  else if(a==='chgOpen'){draft.chg={m:opM,id:'',n:1,note:'',other:''};render()}
  else if(a==='chgX'){draft.chg=null;render()}
  else if(a==='chgPick'){if(draft.chg){draft.chg.id=id;render();if(id==='__other')document.getElementById('chO')?.focus()}}
  else if(a==='chgSave'){const ch=draft.chg;if(!ch||!ch.id){setMsg('Tap the accessory you need first.');render();return}
    const nm=(ls.get('opName')||'').trim()||'Operator',n=Math.max(1,Math.round(num(ch.n))),note=String(ch.note||'').trim(),it=(S.acc||[]).find(x=>x.id===ch.id);
    const run=S.jobs.find(x=>x.machine===ch.m&&x.status==='running')||{machine:ch.m,id:'',part:''};
    if(it&&n<=num(it.qty)){it.qty=num(it.qty)-n;accLogAdd(it,-n,nm,note);logEv('accuse',{...run,machine:ch.m,operator:nm},{item:it.name,qty:n,left:num(it.qty),min:num(it.min),note});draft.chg=null;
      setMsg(`Booked out: ${n} × ${it.name}. Collect it from the store.`);save();return}
    const what=it?it.name:String(ch.other||'').trim();if(!what){setMsg('Type what you need.');render();return}
    logEv('problem',{...run,machine:ch.m,operator:nm},{reason:it?'Out of stock':'Accessory needed',note:`${n} × ${what}${it?(num(it.qty)>0?` (only ${num(it.qty)} in stock)`:''):' (not on the list)'}${note?' — '+note:''}`});
    draft.chg=null;setMsg(it?`${it.name} is not available in the store — a request has been sent to the planner.`:'Request sent to the planner.');save()}
  else if(a==='jt'){draft.jt=id||'';render()}
  else if(a==='jopen'){draft.jopen=draft.jopen===id?'':id;render()}
  else if(a==='jxls'){exportJobs()}
  else if(a==='of'){draft.of=id||'';render()}
  else if(a==='xls'){exportXls()}
  else if(a==='addOrder'){const od=draft.ord,L=num(od.L),W=num(od.W),n=Math.min(200,Math.max(1,Math.round(num(od.n))));
    if(!(L>0&&W>0)){setMsg('Enter the plate length and width.');render();return}
    let m=od.mid==='new'?null:mat(od.mid);
    if(!m){const th=num(od.nt);if(!(th>0)){setMsg('Enter the new thickness.');render();return}const [ty,gr]=(od.mk||'|').split('|');
      m=S.materials.find(x=>mk(x)===od.mk&&num(x.thick)===th);if(!m){m={id:nextId('M-',S.materials,0),type:ty,grade:gr||'',thick:th,code:'',reorder:0,supplier:''};S.materials.push(m)}}
    const line=nextId('O-',S.plates.filter(p=>p.line).map(p=>({id:p.line})),0),now=Date.now();
    for(let i=0;i<n;i++)S.plates.push({id:nextId('P-',S.plates,0),materialId:m.id,shape:'rect',d:{L,W},status:'ordered',origin:'purchase',line,orderedAt:now,createdAt:now,supplier:String(od.sup||'').trim(),po:String(od.po||'').trim()});
    ordLogAdd('ordered',m,{L,W},n,{supplier:String(od.sup||'').trim(),po:String(od.po||'').trim()});draft.ord={...od,mid:m.id,nt:'',L:'',W:'',n:1};setMsg(`${n} plate(s) of ${mName(m)} ${L}×${W} added to the order — now showing as on order in Stock.`);save()}
  else if(a==='arrOne'||a==='arrAll'){const l=orderLines().find(x=>x.key===id);if(l){const ps=a==='arrOne'?l.plates.slice(0,1):l.plates,now=Date.now();for(const p of ps){p.status='available';p.arrivedAt=now;p.createdAt=now}ordLogAdd('received',l.m,l.d,ps.length,{supplier:l.supplier,po:l.po});setMsg(`${ps.length} plate(s) of ${mName(l.m)} booked into stock.`);save()}}
  else if(a==='cancelLine'){if(armed!=='c'+id){armed='c'+id;render();return}const l=orderLines().find(x=>x.key===id);if(l){ordLogAdd('cancelled',l.m,l.d,l.plates.length,{supplier:l.supplier,po:l.po});const ids=new Set(l.plates.map(p=>p.id));S.plates=S.plates.filter(p=>!ids.has(p.id))}armed='';save()}
  else if(a==='sf'){draft.sf=id||'';render()}
  else if(a==='open'){draft.open=draft.open===id?'':id;draft.rc={L:'',W:'',n:1,st:'available'};render()}
  else if(a==='recv'){const m=mat(id),rc=draft.rc,L=num(rc.L),W=num(rc.W),n=Math.min(200,Math.max(1,Math.round(num(rc.n))));if(!m||!(L>0&&W>0)){setMsg('Enter the plate length and width.');render();return}
    for(let i=0;i<n;i++)S.plates.push({id:nextId('P-',S.plates,0),materialId:m.id,shape:'rect',d:{L,W},status:rc.st==='ordered'?'ordered':'available',origin:'purchase',createdAt:Date.now()});
    ordLogAdd(rc.st==='ordered'?'ordered':'booked',m,{L,W},n);draft.rc={L:'',W:'',n:1,st:rc.st};setMsg(`${n} plate(s) of ${mName(m)} added${rc.st==='ordered'?' as on order':''}.`);save()}
  else if(a==='arrived'){const p=plate(id);if(p){p.status='available';p.arrivedAt=Date.now();ordLogAdd('received',mat(p.materialId),p.d,1,{supplier:p.supplier||'',po:p.po||''});setMsg(`${p.id} booked into stock.`);save()}}
  else if(a==='delPlate'){if(armed!==id){armed=id;render();return}S.plates=S.plates.filter(p=>p.id!==id);armed='';save()}
  else if(a==='addMat'){const dm=draft.mat;if(!(num(dm.thick)>0)){setMsg('Fill in the thickness.');render();return}
    S.materials.push({id:nextId('M-',S.materials,0),type:dm.type,grade:String(dm.grade||'').trim(),thick:num(dm.thick),code:String(dm.code||'').trim(),reorder:num(dm.reorder),supplier:String(dm.supplier||'').trim()});
    const nm=S.materials[S.materials.length-1];draft.open=nm.id;draft.sf=nm.type;setMsg(mName(nm)+' added. Book in its plates below.');save()}
  else if(a==='addType'){const n=String(draft.nt.name||'').trim();if(!n){setMsg('Type a name for the new material.');render();return}if(types().some(t=>t.name.toLowerCase()===n.toLowerCase())){setMsg(n+' is already in the list.');render();return}S.types=[...types(),{name:n,dens:num(draft.nt.dens)||7.85}];draft.mat.type=n;draft.nt={name:'',dens:7.85};setMsg('Material type '+n+' added.');save()}
  else if(a==='scrap'){if(armed!==id){armed=id;render();return}const p=plate(id);if(p)p.status='scrap';armed='';save()}
});
addEventListener('hashchange',()=>{armed='';zoom='';render()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&zoom){zoom='';render()}

  if(e.key==='Enter'&&e.target&&e.target.dataset){const d=e.target.dataset;if(d.lg){e.preventDefault();(document.querySelector('[data-act=lgSetup]')||document.querySelector('[data-act=lgGo]'))?.click()}else if(d.st==='npw')document.querySelector('[data-act=uPwSave]')?.click();else if(d.sto)document.querySelector(`[data-act=opPw][data-id=${d.sto}]`)?.click()}});
applyWp();applyBlk();applyBlo();applyHl();render();

async function startData(){
  let db=null;try{[db,assets,dls]=await Promise.all([window.claude?.use('db'),window.claude?.use('assets').catch(()=>null),window.claude?.use('downloads').catch(()=>null)])}catch(e){db=null}
  assets=assets||null;dls=dls||null;
  if(!db){ready=true;render();return}
  ref=db.doc('shop/state');
  const t=setTimeout(()=>{if(!ready){ready=true;setMsg('The shop data can’t be reached yet — showing an empty view.');render()}},10000);
  ref.onSnapshot(s=>{
    if(!s.metadata.fromCache)clearTimeout(t);
    const d=s.exists?JSON.parse(JSON.stringify(s.data())):{};
    const A=k=>Array.isArray(d[k])?d[k]:[];
    S={types:A('types'),materials:A('materials'),plates:A('plates'),jobs:A('jobs'),events:A('events'),maint:d.maint&&typeof d.maint==='object'&&!Array.isArray(d.maint)?d.maint:{},acc:A('acc'),accLog:A('accLog'),ordLog:A('ordLog'),auth:d.auth&&typeof d.auth==='object'&&!Array.isArray(d.auth)?d.auth:{users:[],op:{}}};
    const mx=S.events.reduce((x,e)=>Math.max(x,num(e.t)),0);
    if(evSeen==null)evSeen=mx;else{const nw=S.events.filter(e=>num(e.t)>evSeen&&!myEv.has(e.id));evSeen=Math.max(evSeen,mx);const al=nw.filter(evOn),u=me();if(al.length&&u&&u.role!=='op'){const last=al[al.length-1];beep(last.type);toast(last)}}
    ready=true;render();
  },e=>{clearTimeout(t);ready=true;setMsg('Live updates stopped ('+(e&&e.code||'error')+'). Reopen the page to reconnect.');render()});
}
let downT=0;
function srvHello(){return SRV.me().then(r=>{clearInterval(downT);downT=0;srv={...(r||srv),down:''};if(srv.me){ready=false;render();startData()}else{ready=true;render()}})
  .catch(e=>{srv.down=e.message||'Can’t reach the workshop server.';srv.old=!!e.old;ready=true;render();if(!downT&&!e.old)downT=setInterval(()=>{SRV.me().then(()=>srvHello()).catch(()=>{})},5000)})}
if(SRV)srvHello();
else startData();
}
